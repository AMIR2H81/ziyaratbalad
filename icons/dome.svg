<?xml version="1.0" encoding="UTF-8"?>
<svg width="112" height="112" viewBox="0 0 112 112" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ziarat pilgrimage app icon">
  <title>Ziarat App Icon</title>
  <desc>Gold ornamental Islamic frame with a green shrine dome icon in the center. No moon or star symbols.</desc>

  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.1" stdDeviation="1.1" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Transparent 112px outer frame -->
  <rect width="112" height="112" fill="none"/>

  <!-- Outer ornamental gold frame -->
  <path
    d="M56 5
       C62 15 73 16 76.5 29
       C88 26 94.5 33 94.5 43
       C104 47 106.5 55.5 101 62
       C106 70 99 80 88.5 79
       C85 91 72 91 66 100
       C62 91 50 91 46 100
       C40 91 27 91 23.5 79
       C13 80 6 70 11 62
       C5.5 55.5 8 47 17.5 43
       C17.5 33 24 26 35.5 29
       C39 16 50 15 56 5Z"
    stroke="#C8A45D"
    stroke-width="7"
    stroke-linejoin="round"
    filter="url(#softShadow)"
  />

  <!-- Inner gold frame line -->
  <path
    d="M56 14
       C61 22 69 23.5 71.8 34
       C81.5 31.5 87 37 86.7 46
       C94.2 49.5 96.5 56 91.8 62
       C95.8 68.5 90 75.6 81.2 75
       C78 85 67.5 85.3 62.8 93
       C60 87.6 52 87.6 49.2 93
       C44.5 85.3 34 85 30.8 75
       C22 75.6 16.2 68.5 20.2 62
       C15.5 56 17.8 49.5 25.3 46
       C25 37 30.5 31.5 40.2 34
       C43 23.5 51 22 56 14Z"
    stroke="#C8A45D"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Gold base flourish -->
  <path
    d="M23 82
       C36 77 45 77 56 88
       C67 77 76 77 89 82
       C75 86 65 91 56 103
       C47 91 37 86 23 82Z"
    fill="#C8A45D"
  />

  <!-- Central green dome -->
  <g filter="url(#softShadow)">
    <!-- Dome body -->
    <path
      d="M31 67
         C31.5 49 41.5 36 56 36
         C70.5 36 80.5 49 81 67
         L31 67Z"
      fill="#0F6B5B"
    />

    <!-- Dome ribs -->
    <path d="M56 37 C55.5 45 55.2 56 55.8 67" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.95"/>
    <path d="M47.5 39 C43.8 48 42.8 57.5 43.2 67" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.95"/>
    <path d="M64.5 39 C68.2 48 69.2 57.5 68.8 67" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.95"/>
    <path d="M39.5 46 C35.2 53.5 34.5 60.2 34.8 67" stroke="#FFFFFF" stroke-width="1.45" stroke-linecap="round" opacity="0.95"/>
    <path d="M72.5 46 C76.8 53.5 77.5 60.2 77.2 67" stroke="#FFFFFF" stroke-width="1.45" stroke-linecap="round" opacity="0.95"/>

    <!-- Dome lower band -->
    <path
      d="M29.5 67
         C29 64.8 30.4 63.2 32.7 63.2
         H79.3
         C81.6 63.2 83 64.8 82.5 67
         L81.8 70
         H30.2
         L29.5 67Z"
      fill="#0F6B5B"
    />
    <path d="M30 67.5 H82" stroke="#FFFFFF" stroke-width="1.4" opacity="0.95"/>

    <!-- Shrine facade -->
    <path
      d="M33 70
         H79
         V85
         C70 84.5 63.5 88 56 95
         C48.5 88 42 84.5 33 85
         V70Z"
      fill="#0F6B5B"
    />

    <!-- Arcade negative shapes -->
    <path d="M36 84 V76 C36 73.8 38 72 40 72 C42 72 44 73.8 44 76 V84" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 84 V76 C48 73.8 50 72 52 72 C54 72 56 73.8 56 76 V84" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M68 84 V76 C68 73.8 70 72 72 72 C74 72 76 73.8 76 76 V84" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Central mihrab/door -->
    <path
      d="M56 73
         C51 76.5 49 79.8 49 84
         V93
         H63
         V84
         C63 79.8 61 76.5 56 73Z"
      fill="#0F6B5B"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linejoin="round"
    />
  </g>

  <!-- Simple gold finial, no moon/star -->
  <g fill="#C8A45D">
    <path d="M54.2 35.8 C54.3 33.8 55.7 32.7 56 30.5 C56.3 32.7 57.7 33.8 57.8 35.8 H54.2Z"/>
    <circle cx="56" cy="28.2" r="1.65"/>
    <circle cx="56" cy="24.2" r="1.25"/>
    <circle cx="56" cy="20.7" r="0.9"/>
    <path d="M56 15.8 L57.2 19.2 H54.8 L56 15.8Z"/>
  </g>
</svg>
